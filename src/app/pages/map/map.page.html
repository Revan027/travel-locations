<ion-header [translucent]="true">
  <ion-toolbar class="travel-header">
    <ion-buttons slot="start">
      <ion-icon name="compass" class="app-logo"></ion-icon>
    </ion-buttons>

    <ion-title class="travel-title">
      <span class="title-main">Travel</span>
      <span class="title-accent">Locations</span>
    </ion-title>
    
    <ion-buttons slot="end">
      <app-auth-status></app-auth-status>
    </ion-buttons>
  </ion-toolbar>  

  <ion-fab-button class="btn-refresh" size="small" expand="block" (click)="onRefreshPosition()" [disabled]="islocatingUsers() || !user().isAuthenticated">
    @if(islocatingUsers()){
      <ion-spinner name="dots"></ion-spinner>
    }
    @else{
      <span class="material-icons-outlined">my_location</span>
    }
  </ion-fab-button>

   <ion-fab-button class="btn-add" size="small" expand="block" (click)="onActiveCreationLocation()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>

    <ion-fab-button class="btn-filters" size="small" id="modal-filters" expand="block">
      <ion-icon size="small" name="filter-outline"></ion-icon>
    </ion-fab-button> 
    
    <ion-fab-button class="btn-api-search-modal" size="small" expand="block" (click)="onOpenSearchModal()">
      <ion-icon name="search-outline"></ion-icon>
    </ion-fab-button> 
</ion-header>

<ion-content [fullscreen]="true">
  @if(!isMapInit()){
    <app-loader></app-loader>
  }
  
  <app-api-search-modal></app-api-search-modal>
  
  <div id="map" class=""></div>

  <app-filters></app-filters>
</ion-content>
