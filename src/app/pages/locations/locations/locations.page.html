<ion-header [translucent]="true">
  <ion-toolbar class="travel-header">
    <ion-buttons slot="start">
      <ion-icon name="compass" class="app-logo"></ion-icon>
    </ion-buttons>
    
    <ion-title class="travel-title">
      <span class="title-main">Mes</span>
      <span class="title-accent">Lieux</span>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-accordion-group>
      @for(item of objectEntries(groupLocation); track item[0]){
        <ion-accordion value="{{item[0]}}">
          <ion-item slot="header" color="light">
            <ion-label><span class="material-icons ion-margin-end">{{item[1][0].typeIcon}}</span> <SPAN>{{ this.getLocationType(item[0]) }}</SPAN></ion-label>
          </ion-item>

          <div slot="content">
             <ion-list>
                @for(location of item[1]; track location.id)
                {
                  <ion-item>
                    <ion-label> {{location.name}}</ion-label>
                  </ion-item>
                  
                }
                
             </ion-list>         
          </div>
        </ion-accordion>
      }

</ion-accordion-group>
</ion-content>
