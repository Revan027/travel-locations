<ion-modal class="modal-filters" trigger="modal-filters" [initialBreakpoint]="0.4" [breakpoints]="[0, 0.25, 0.4, 0.5]">
    <ng-template>
      <ion-content>             
        <ion-title class="ion-margin ion-text-center"> Filtrer les lieux </ion-title>

          <form [formGroup]="formGroup" novalidate>
            <ion-grid>
              <ion-row class="ion-align-content-end">
                <ion-col size="6">
                  <ion-label>Date limite</ion-label>

                    <ion-datetime-button datetime="date"></ion-datetime-button>

                    <ion-modal [keepContentsMounted]="true">
                      <ng-template>
                        <ion-datetime
                          id="date"
                          presentation="date"
                          formControlName="date"
                          [formatOptions]="{
                            date: {
                              weekday: 'short',
                              month: 'long',
                              day: '2-digit',
                              year: 'numeric'
                            },
                          }"
                        ></ion-datetime>
                      </ng-template>
                    </ion-modal>    
                </ion-col>

                <ion-col size="6" class="ion-align-content-end">
                  <ion-select
                    label="Type"
                    formControlName="typeIDs"
                    interface="popover"
                    placeholder="-"
                    fill="outline"
                    [multiple]="true">

                    @for(item of locationsType(); track item.name){
                      <ion-select-option [value]="item.id">
                        {{item.name}}
                      </ion-select-option>
                    }
                  </ion-select>
                </ion-col>

                <ion-col size="6" class="ion-align-content-end">
                  <ion-select
                      label="Pays"
                      formControlName="country"
                      interface="popover"
                      placeholder="-"
                      fill="outline">

                      @for(item of countries(); track item.name){
                        <ion-select-option [value]="item.id">
                          {{item.name}}
                        </ion-select-option>
                      }
                    </ion-select>
                </ion-col>
              </ion-row>
            </ion-grid>
           
            <div class="ion-display-flex ion-justify-content-end ion-margin">
              <ion-button [strong]="true" [disabled]="formGroup.invalid" (click)="onSubmit(formGroup.value)">Valider</ion-button>
            </div>
          </form>       
      </ion-content>
    </ng-template>
</ion-modal>
